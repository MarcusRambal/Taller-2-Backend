services:

  api: 
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api

    
  nginx: 
    image: nginx:stable-alpine3.24
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro


  redis:
    image: redis:7-alpine
    container_name: redis

